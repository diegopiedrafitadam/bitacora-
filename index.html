<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171b16">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bitácora — Comidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171b16;
    --surface: #1f251d;
    --surface-2: #262d23;
    --border: #333c2f;
    --paper: #ece7d9;
    --paper-dim: #b9b5a4;
    --gold: #c9a227;
    --gold-dim: #8a7220;

    --c-desayuno: #7c9473;
    --c-almuerzo: #c9a227;
    --c-merienda: #a16b4c;
    --c-cena: #5c7a99;
    --c-permitido: #8b6fae;

    --radius-photo: 6px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--paper);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{ padding-bottom:64px; }
  h1,h2,h3,.num{ font-family:'Fraunces', serif; }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:14px 18px 12px;
  }
  .topbar h1{ font-size:20px; font-weight:600; margin:0 0 10px; letter-spacing:0.2px; }

  .date-row{ display:flex; align-items:center; gap:10px; }
  .date-row button.nav{
    background:none; border:1px solid var(--border); color:var(--paper);
    width:32px; height:32px; border-radius:4px; font-size:16px; cursor:pointer;
  }
  .date-row button.nav:active{ background:var(--surface-2); }
  .date-label{ flex:1; text-align:center; font-size:14px; color:var(--paper-dim); }
  .date-label b{ color:var(--paper); font-weight:600; }

  .totals{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:6px;
    overflow:hidden; margin:14px 18px 0;
  }
  .totals .cell{ background:var(--surface); padding:10px 6px; text-align:center; }
  .totals .cell .num{ font-size:20px; font-weight:600; color:var(--gold); line-height:1; }
  .totals .cell .lbl{ font-size:10px; color:var(--paper-dim); margin-top:4px; letter-spacing:0.3px; }

  .section-title{
    padding:20px 18px 8px; font-size:12px; color:var(--paper-dim);
    letter-spacing:0.4px;
  }

  .entries{ padding:0 18px; display:flex; flex-direction:column; gap:10px; }
  .entry{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--tag-color, var(--gold)); border-radius:2px; padding:10px;
  }
  .entry img{
    width:56px; height:56px; object-fit:cover; border-radius:var(--radius-photo); flex-shrink:0;
    background:var(--surface-2);
  }
  .entry .info{ flex:1; min-width:0; }
  .entry .tag{ font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--tag-color); font-weight:600; }
  .entry .desc{ font-size:13.5px; color:var(--paper); margin:3px 0 5px; line-height:1.35; }
  .entry .macros{ font-size:11.5px; color:var(--paper-dim); }
  .entry .del{
    background:none; border:none; color:var(--paper-dim); font-size:18px; cursor:pointer;
    padding:0 4px; align-self:flex-start;
  }

  .empty{ padding:30px 18px; text-align:center; color:var(--paper-dim); font-size:13px; }

  .fab{
    position:fixed; right:18px; bottom:20px; width:56px; height:56px; border-radius:50%;
    background:var(--gold); color:#1b1f16; border:none; font-size:28px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.4); z-index:30;
  }

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(10,12,9,0.7); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg); width:100%; max-width:480px; border-radius:14px 14px 0 0;
    border:1px solid var(--border); border-bottom:none; padding:18px; max-height:92vh; overflow-y:auto;
  }
  .modal h2{ font-size:18px; margin:0 0 14px; font-weight:600; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--paper-dim); margin-bottom:6px; letter-spacing:0.3px; }
  .meal-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .meal-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--paper-dim);
    padding:8px 2px; border-radius:5px; font-size:11px; cursor:pointer; text-align:center;
  }
  .meal-btn.active{ color:#171b16; font-weight:600; border-color:transparent; }
  textarea, input[type=text]{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--paper);
    border-radius:6px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:14px; resize:none;
  }
  .photo-picker{
    border:1.5px dashed var(--border); border-radius:8px; padding:18px; text-align:center;
    color:var(--paper-dim); font-size:13px; cursor:pointer; position:relative; overflow:hidden;
  }
  .photo-picker img{ max-width:100%; max-height:180px; border-radius:6px; display:block; margin:0 auto; }
  .photo-picker input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .btn-primary{
    width:100%; background:var(--gold); color:#171b16; border:none; padding:13px;
    border-radius:7px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-primary:disabled{ opacity:0.5; }
  .btn-ghost{
    width:100%; background:none; border:1px solid var(--border); color:var(--paper-dim); padding:11px;
    border-radius:7px; font-size:13px; margin-top:8px; cursor:pointer;
  }

  .macro-edit{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .macro-edit .field label{ text-align:center; }
  .macro-edit input{ text-align:center; padding:8px 4px; }

  .status-line{ font-size:12.5px; color:var(--gold-dim); text-align:center; margin:8px 0; min-height:16px; }

  /* History */
  .hist-bars{ display:flex; align-items:flex-end; gap:6px; height:110px; padding:0 18px; margin-top:6px; }
  .hist-bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .hist-bar{ width:100%; background:var(--gold); border-radius:3px 3px 0 0; min-height:2px; }
  .hist-bar.today{ background:var(--paper); }
  .hist-lbl{ font-size:9.5px; color:var(--paper-dim); margin-top:5px; }
  .hist-val{ font-size:9.5px; color:var(--paper-dim); margin-bottom:3px; }

  .tabs{ display:flex; gap:8px; padding:0 18px; margin-top:4px; }
  .tab{ font-size:11.5px; color:var(--paper-dim); border:1px solid var(--border); border-radius:14px; padding:5px 12px; cursor:pointer; }
  .tab.active{ background:var(--surface-2); color:var(--paper); border-color:var(--paper-dim); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Bitácora de comidas</h1>
  <div class="date-row">
    <button class="nav" id="prevDay">‹</button>
    <div class="date-label" id="dateLabel">—</div>
    <button class="nav" id="nextDay">›</button>
  </div>
</div>

<div class="totals" id="totals"></div>

<div class="section-title" id="entriesTitle">COMIDAS DEL DÍA</div>
<div class="entries" id="entries"></div>

<div class="section-title">ÚLTIMOS 7 DÍAS · KCAL</div>
<div class="hist-bars" id="histBars"></div>

<button class="fab" id="openAdd">+</button>

<div id="modalRoot"></div>

<script>
const MEAL_TYPES = [
  { id:'desayuno', label:'Desayuno', color:'var(--c-desayuno)' },
  { id:'almuerzo', label:'Almuerzo', color:'var(--c-almuerzo)' },
  { id:'merienda', label:'Merienda', color:'var(--c-merienda)' },
  { id:'cena', label:'Cena', color:'var(--c-cena)' },
  { id:'permitido', label:'Permitido', color:'var(--c-permitido)' },
];
const mealColor = id => (MEAL_TYPES.find(m=>m.id===id)||{}).color || 'var(--gold)';
const mealLabel = id => (MEAL_TYPES.find(m=>m.id===id)||{}).label || id;

function fmtDate(d){
  return d.toISOString().slice(0,10);
}
function labelForDate(dateStr){
  const today = fmtDate(new Date());
  const y = fmtDate(new Date(Date.now()-86400000));
  if(dateStr===today) return 'Hoy';
  if(dateStr===y) return 'Ayer';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'});
}

let currentDate = fmtDate(new Date());
let currentEntries = [];

// ---------- storage helpers ----------
async function getDay(dateStr){
  try{
    const r = await window.storage.get('day:'+dateStr, false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function setDay(dateStr, entries){
  await window.storage.set('day:'+dateStr, JSON.stringify(entries), false);
  await updateIndex(dateStr, entries);
}
async function getIndex(){
  try{
    const r = await window.storage.get('days-index', false);
    return r ? JSON.parse(r.value) : {};
  }catch(e){ return {}; }
}
async function updateIndex(dateStr, entries){
  const idx = await getIndex();
  const totals = sumEntries(entries);
  if(entries.length===0){ delete idx[dateStr]; }
  else { idx[dateStr] = totals; }
  await window.storage.set('days-index', JSON.stringify(idx), false);
}
function sumEntries(entries){
  return entries.reduce((acc,e)=>{
    acc.kcal += Number(e.kcal)||0;
    acc.protein += Number(e.protein)||0;
    acc.carbs += Number(e.carbs)||0;
    acc.fat += Number(e.fat)||0;
    acc.fiber += Number(e.fiber)||0;
    return acc;
  }, {kcal:0, protein:0, carbs:0, fat:0, fiber:0});
}

// ---------- rendering ----------
function renderTotals(entries){
  const t = sumEntries(entries);
  document.getElementById('totals').innerHTML = `
    <div class="cell"><div class="num">${Math.round(t.kcal)}</div><div class="lbl">KCAL</div></div>
    <div class="cell"><div class="num">${Math.round(t.protein)}</div><div class="lbl">PROT g</div></div>
    <div class="cell"><div class="num">${Math.round(t.carbs)}</div><div class="lbl">CARB g</div></div>
    <div class="cell"><div class="num">${Math.round(t.fat)}</div><div class="lbl">GRASA g</div></div>
    <div class="cell"><div class="num">${Math.round(t.fiber)}</div><div class="lbl">FIBRA g</div></div>
  `;
}

function renderEntries(entries){
  const el = document.getElementById('entries');
  if(entries.length===0){
    el.innerHTML = `<div class="empty">Todavía no cargaste nada este día. Tocá el botón + para sumar una comida.</div>`;
    return;
  }
  el.innerHTML = entries.map(e => `
    <div class="entry" style="--tag-color:${mealColor(e.mealType)}">
      <div class="info">
        <div class="tag">${mealLabel(e.mealType)}</div>
        <div class="desc">${e.description || ''}${e.note ? ' · ' + e.note : ''}</div>
        <div class="macros">${Math.round(e.kcal)} kcal · P ${Math.round(e.protein)}g · C ${Math.round(e.carbs)}g · G ${Math.round(e.fat)}g · Fi ${Math.round(e.fiber)}g</div>
      </div>
      <button class="del" data-id="${e.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.dataset.id));
  });
}

async function renderHistory(){
  const idx = await getIndex();
  const days = [];
  for(let i=6;i>=0;i--){
    const d = fmtDate(new Date(Date.now()-i*86400000));
    days.push({date:d, kcal: idx[d] ? idx[d].kcal : 0});
  }
  const max = Math.max(...days.map(d=>d.kcal), 1);
  const today = fmtDate(new Date());
  document.getElementById('histBars').innerHTML = days.map(d=>{
    const h = Math.max(2, Math.round((d.kcal/max)*90));
    const dd = new Date(d.date+'T00:00:00');
    const lbl = dd.toLocaleDateString('es-AR',{weekday:'narrow'});
    return `<div class="hist-bar-wrap">
      <div class="hist-val">${d.kcal ? Math.round(d.kcal) : ''}</div>
      <div class="hist-bar ${d.date===today?'today':''}" style="height:${h}px"></div>
      <div class="hist-lbl">${lbl}</div>
    </div>`;
  }).join('');
}

async function loadDay(dateStr){
  currentDate = dateStr;
  document.getElementById('dateLabel').innerHTML = `<b>${labelForDate(dateStr)}</b>`;
  currentEntries = await getDay(dateStr);
  renderTotals(currentEntries);
  renderEntries(currentEntries);
  renderHistory();
}

document.getElementById('prevDay').addEventListener('click', ()=>{
  loadDay(fmtDate(new Date(new Date(currentDate+'T00:00:00').getTime()-86400000)));
});
document.getElementById('nextDay').addEventListener('click', ()=>{
  const next = fmtDate(new Date(new Date(currentDate+'T00:00:00').getTime()+86400000));
  const today = fmtDate(new Date());
  if(next<=today) loadDay(next);
});

async function deleteEntry(id){
  currentEntries = currentEntries.filter(e=>e.id!==id);
  await setDay(currentDate, currentEntries);
  renderTotals(currentEntries);
  renderEntries(currentEntries);
  renderHistory();
}

// ---------- add-entry modal ----------
let pickedImage = null; // {dataUrl, base64, mediaType}
let selectedMeal = 'almuerzo';
let lastEstimate = null;
let activeTab = 'foto';

// ---------- favoritos (comidas frecuentes) ----------
async function getFavorites(){
  try{
    const r = await window.storage.get('favorites', false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveFavorite(fav){
  const favs = await getFavorites();
  favs.unshift({ id:'f'+Date.now(), ...fav });
  await window.storage.set('favorites', JSON.stringify(favs.slice(0,40)), false);
}
async function deleteFavorite(id){
  const favs = (await getFavorites()).filter(f=>f.id!==id);
  await window.storage.set('favorites', JSON.stringify(favs), false);
  renderFavList();
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById('tabFoto').classList.toggle('active', tab==='foto');
  document.getElementById('tabFav').classList.toggle('active', tab==='fav');
  document.getElementById('fotoTabContent').style.display = tab==='foto' ? 'block' : 'none';
  document.getElementById('favTabContent').style.display = tab==='fav' ? 'block' : 'none';
  document.getElementById('analyzeBtn').style.display = tab==='foto' ? 'block' : 'none';
  document.getElementById('macroBlock').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('statusLine').textContent = '';
}

async function renderFavList(){
  const favs = await getFavorites();
  const el = document.getElementById('favList');
  if(favs.length===0){
    el.innerHTML = `<div class="empty" style="padding:16px 0">Todavía no guardaste ninguna comida frecuente. Analizá una por foto y tildá "Guardar como comida frecuente".</div>`;
    return;
  }
  el.innerHTML = favs.map(f=>`
    <div class="entry" style="--tag-color:${mealColor(f.mealType)}; margin-bottom:8px; cursor:pointer;" data-id="${f.id}">
      <div class="info">
        <div class="tag">${mealLabel(f.mealType)}</div>
        <div class="desc">${f.description}</div>
        <div class="macros">${Math.round(f.kcal)} kcal · P ${Math.round(f.protein)}g · C ${Math.round(f.carbs)}g · G ${Math.round(f.fat)}g · Fi ${Math.round(f.fiber)}g</div>
      </div>
      <button class="del" data-del="${f.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.entry').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.dataset.del) return;
      const fav = favs.find(f=>f.id===card.dataset.id);
      useFavorite(fav);
    });
  });
  el.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteFavorite(btn.dataset.del);
    });
  });
}

function useFavorite(fav){
  selectedMeal = fav.mealType;
  updateMealSelection();
  document.getElementById('descInput').value = fav.description;
  document.getElementById('kcalInput').value = Math.round(fav.kcal);
  document.getElementById('protInput').value = Math.round(fav.protein);
  document.getElementById('carbInput').value = Math.round(fav.carbs);
  document.getElementById('fatInput').value = Math.round(fav.fat);
  document.getElementById('fiberInput').value = Math.round(fav.fiber);
  document.getElementById('favCheckbox').checked = false;
  document.getElementById('macroBlock').style.display = 'block';
  document.getElementById('saveBtn').style.display = 'block';
  document.getElementById('statusLine').textContent = 'Cargado — tocá Guardar o ajustá algo antes.';
}

// Versión de ALTA calidad: la que se manda a analizar. Prioriza detalle sobre peso.
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1280;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function openModal(){
  pickedImage = null;
  lastEstimate = null;
  selectedMeal = 'almuerzo';
  activeTab = 'foto';
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h2>Nueva comida</h2>

        <div class="tabs" style="padding:0 0 14px">
          <div class="tab active" id="tabFoto" style="padding:6px 14px">Foto</div>
          <div class="tab" id="tabFav" style="padding:6px 14px">Frecuentes</div>
        </div>

        <div id="fotoTabContent">
          <div class="field">
            <label>FOTO</label>
            <label class="photo-picker" id="photoPicker">
              <span id="photoHint">Tocá para sacar o elegir una foto</span>
              <input type="file" accept="image/*" capture="environment" id="photoInput">
            </label>
          </div>
        </div>

        <div id="favTabContent" style="display:none">
          <div class="field" id="favList"></div>
        </div>

        <div class="field">
          <label>COMIDA</label>
          <div class="meal-grid" id="mealGrid">
            ${MEAL_TYPES.map(m=>`<div class="meal-btn" data-id="${m.id}" style="--c:${m.color}">${m.label}</div>`).join('')}
          </div>
        </div>

        <div class="field" id="noteField">
          <label>ACLARACIÓN (opcional)</label>
          <textarea id="noteInput" rows="2" placeholder="ej: sin aceite, porción chica, con arroz integral..."></textarea>
        </div>

        <div class="status-line" id="statusLine"></div>

        <div id="macroBlock" style="display:none">
          <div class="field"><label>DESCRIPCIÓN</label><input type="text" id="descInput"></div>
          <div class="macro-edit">
            <div class="field"><label>Kcal</label><input type="text" id="kcalInput"></div>
            <div class="field"><label>Prot g</label><input type="text" id="protInput"></div>
            <div class="field"><label>Carb g</label><input type="text" id="carbInput"></div>
            <div class="field"><label>Grasa g</label><input type="text" id="fatInput"></div>
            <div class="field"><label>Fibra g</label><input type="text" id="fiberInput"></div>
          </div>
          <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--paper-dim); margin-bottom:4px; cursor:pointer;">
            <input type="checkbox" id="favCheckbox"> Guardar como comida frecuente
          </label>
        </div>

        <button class="btn-primary" id="analyzeBtn">Analizar foto</button>
        <button class="btn-primary" id="saveBtn" style="display:none">Guardar</button>
        <button class="btn-ghost" id="cancelBtn">Cancelar</button>
      </div>
    </div>
  `;

  document.getElementById('mealGrid').querySelectorAll('.meal-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedMeal = btn.dataset.id;
      updateMealSelection();
    });
  });
  updateMealSelection();

  document.getElementById('tabFoto').addEventListener('click', ()=> switchTab('foto'));
  document.getElementById('tabFav').addEventListener('click', ()=> switchTab('fav'));
  renderFavList();

  document.getElementById('photoInput').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    const dataUrl = await resizeImage(file);
    pickedImage = { dataUrl };
    document.getElementById('photoPicker').innerHTML = `<img src="${dataUrl}"><input type="file" accept="image/*" capture="environment" id="photoInput2">`;
    document.getElementById('photoInput2').addEventListener('change', async (ev2)=>{
      const f2 = ev2.target.files[0];
      if(!f2) return;
      const du2 = await resizeImage(f2);
      pickedImage = { dataUrl: du2 };
      document.querySelector('#photoPicker img').src = du2;
    });
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalBg').addEventListener('click', (e)=>{
    if(e.target.id==='modalBg') closeModal();
  });

  document.getElementById('analyzeBtn').addEventListener('click', analyzePhoto);
  document.getElementById('saveBtn').addEventListener('click', saveEntry);
}

function updateMealSelection(){
  document.getElementById('mealGrid').querySelectorAll('.meal-btn').forEach(btn=>{
    if(btn.dataset.id===selectedMeal){
      btn.classList.add('active');
      btn.style.background = `var(--c-${btn.dataset.id})`;
    } else {
      btn.classList.remove('active');
      btn.style.background = '';
    }
  });
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

async function analyzePhoto(){
  if(!pickedImage){
    document.getElementById('statusLine').textContent = 'Primero elegí una foto.';
    return;
  }
  const statusLine = document.getElementById('statusLine');
  const analyzeBtn = document.getElementById('analyzeBtn');
  analyzeBtn.disabled = true;
  statusLine.textContent = 'Analizando la foto…';

  const note = document.getElementById('noteInput').value.trim();
  const base64 = pickedImage.dataUrl.split(',')[1];

  const prompt = `Sos un nutricionista deportivo. Mirá la foto de esta comida y estimá sus valores nutricionales.
${note ? `Aclaración del usuario: "${note}"` : ''}
Respondé ÚNICAMENTE con un JSON válido, sin texto adicional ni backticks, con este formato exacto:
{"descripcion": "string breve en español, ej: Milanesa de pollo con puré", "kcal": number, "proteina_g": number, "carbohidratos_g": number, "grasas_g": number, "fibra_g": number}
Si hay varios alimentos, sumá todo en un solo total. Sé realista con las porciones que ves en la imagen.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        messages: [{
          role: "user",
          content: [
            { type:"image", source:{ type:"base64", media_type:"image/jpeg", data: base64 } },
            { type:"text", text: prompt }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('sin respuesta');
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);

    lastEstimate = parsed;
    document.getElementById('descInput').value = parsed.descripcion || '';
    document.getElementById('kcalInput').value = Math.round(parsed.kcal||0);
    document.getElementById('protInput').value = Math.round(parsed.proteina_g||0);
    document.getElementById('carbInput').value = Math.round(parsed.carbohidratos_g||0);
    document.getElementById('fatInput').value = Math.round(parsed.grasas_g||0);
    document.getElementById('fiberInput').value = Math.round(parsed.fibra_g||0);

    document.getElementById('macroBlock').style.display = 'block';
    statusLine.textContent = 'Listo — revisá y ajustá si hace falta.';
    analyzeBtn.style.display = 'none';
    document.getElementById('saveBtn').style.display = 'block';
  }catch(err){
    statusLine.textContent = 'No pude estimarlo. Podés cargar los valores a mano abajo.';
    document.getElementById('macroBlock').style.display = 'block';
    document.getElementById('descInput').value = note || '';
    analyzeBtn.style.display = 'none';
    document.getElementById('saveBtn').style.display = 'block';
  } finally {
    analyzeBtn.disabled = false;
  }
}

async function saveEntry(){
  const desc = document.getElementById('descInput').value.trim();
  const kcal = parseFloat(document.getElementById('kcalInput').value)||0;
  const protein = parseFloat(document.getElementById('protInput').value)||0;
  const carbs = parseFloat(document.getElementById('carbInput').value)||0;
  const fat = parseFloat(document.getElementById('fatInput').value)||0;
  const fiber = parseFloat(document.getElementById('fiberInput').value)||0;
  const note = document.getElementById('noteInput').value.trim();

  const entry = {
    id: 'e'+Date.now(),
    mealType: selectedMeal,
    description: desc,
    note,
    kcal, protein, carbs, fat, fiber,
    ts: Date.now()
  };

  const favCheckbox = document.getElementById('favCheckbox');
  if(favCheckbox && favCheckbox.checked){
    await saveFavorite({ mealType: selectedMeal, description: desc, kcal, protein, carbs, fat, fiber });
  }

  currentEntries.push(entry);
  await setDay(currentDate, currentEntries);
  renderTotals(currentEntries);
  renderEntries(currentEntries);
  renderHistory();
  closeModal();
}

document.getElementById('openAdd').addEventListener('click', openModal);

// ---------- init ----------
loadDay(currentDate);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}

</script>
